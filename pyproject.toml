[project]
name = "opaque-housing"
version = "0.1.0"
description = "Public, reproducible investigation of opaque residential ownership."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb==1.5.5",
    "fastapi==0.128.0",
    "httpx==0.28.1",
    "itsdangerous==2.2.0",
    "jinja2==3.1.6",
    "polars==1.44.2",
    "pyarrow==25.0.1",
    "pydantic==2.13.5",
    "python-dotenv==1.2.3",
    "python-multipart==0.0.20",
    "typer==0.27.2",
    "uvicorn==0.40.0",
]

[project.scripts]
oh = "opaque_housing.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opaque_housing"]

[tool.hatch.build.targets.wheel.force-include]
"src/opaque_housing/adapters/nyc/lookups" = "opaque_housing/adapters/nyc/lookups"
"src/opaque_housing/app/templates" = "opaque_housing/app/templates"
"src/opaque_housing/app/static" = "opaque_housing/app/static"

[dependency-groups]
dev = [
    "pyright==1.1.414",
    "pytest==9.1.1",
    "ruff==0.16.8",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
