name: refresh

on:
  schedule:
    - cron: "0 12 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stock:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Check PLUTO catalog timestamp
        run: |
          uv run python - <<'PY'
          from opaque_housing.adapters.soda import fetch_view_meta
          meta = fetch_view_meta("64uk-42ks")
          print(meta["dataset_id"], meta["name"], "rowsUpdatedAt", meta["rows_updated_at"])
          PY
      - name: Ingest PLUTO and tract–NTA
        run: uv run oh ingest --metro nyc --dataset all
      - name: Rebuild stock
        run: uv run oh build --metro nyc
      - name: Publish allowlisted aggregates
        run: uv run oh publish --metro nyc
      - name: Ingest Philadelphia OPA
        run: uv run oh ingest --metro phl
      - name: Rebuild Philadelphia stock
        run: uv run oh build --metro phl
      - name: Publish Philadelphia aggregates
        run: uv run oh publish --metro phl
      # Cook stock+sales+build+flow was ~14 min on a laptop (2026-09-18).
      - name: Ingest Cook County stock
        run: uv run oh ingest --metro cook
      - name: Rebuild Cook County stock
        run: uv run oh build --metro cook
      - name: Ingest Cook County sales
        run: uv run oh ingest --metro cook --dataset sales
      - name: Rebuild Cook County flow
        run: uv run oh flow --metro cook
      - name: Publish Cook County aggregates
        run: uv run oh publish --metro cook
      - name: Commit published files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/published/nyc data/published/phl data/published/cook site/data
          if git diff --cached --quiet; then
            echo "no published-file changes"
          else
            git commit -m "refresh published NYC, PHL, and Cook aggregates"
            git push
          fi
      - name: Reload the insight app
        env:
          OH_APP_URL: ${{ secrets.OH_APP_URL }}
          OH_SYNC_TOKEN: ${{ secrets.OH_SYNC_TOKEN }}
        run: |
          if [ -z "$OH_APP_URL" ] || [ -z "$OH_SYNC_TOKEN" ]; then
            echo "skip reload; set repository secrets OH_APP_URL and OH_SYNC_TOKEN"
            exit 0
          fi
          curl -fsS -X POST "${OH_APP_URL%/}/internal/reload" \
            -H "Authorization: Bearer ${OH_SYNC_TOKEN}"
